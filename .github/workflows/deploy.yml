# Tests à chaque push / pull request, puis déploiement vers l'hébergement OVH.
#
# Le déploiement ne s'exécute que si :
#   - les tests sont au vert ;
#   - le push concerne la branche main (ou lancement manuel « Run workflow ») ;
#   - la variable de dépôt DEPLOY_ENABLED vaut « true »
#     (Settings › Secrets and variables › Actions › Variables).
#     À activer seulement APRÈS avoir exécuté la migration SQL en production.
#
# Secrets requis (Settings › Secrets and variables › Actions › Secrets) :
#   FTP_SERVER   ex. ftp.clusterXXX.hosting.ovh.net (espace client OVH › Hébergement › FTP-SSH)
#   FTP_USERNAME identifiant FTP principal
#   FTP_PASSWORD mot de passe FTP
# Variables facultatives :
#   FTP_SERVER_DIR dossier du site, « www/ » par défaut
#   FTP_PROTOCOL   « sftp » par défaut (chiffré, port 22 ; à activer pour l'utilisateur
#                  dans OVH › FTP-SSH). « ftp » en dernier recours : le serveur FTP
#                  d'OVH ne propose pas le FTPS, le mot de passe circule alors en clair.
#
# config/config.php n'est pas dans le dépôt : il n'est jamais envoyé, modifié ni supprimé.
# Les fichiers supprimés du dépôt ne sont pas supprimés du serveur (aucune suppression distante).

name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: agendday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (PHP 8.2 + MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # Base éphémère, détruite à la fin du job et joignable uniquement depuis
          # le runner : pas de mot de passe (évite une fausse alerte des scanners)
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      AGENDDAY_TEST_DB_HOST: 127.0.0.1
      AGENDDAY_TEST_DB_USER: root

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Vérification syntaxique PHP
        run: |
          status=0
          while IFS= read -r -d '' file; do
            out=$(php -l "$file" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $status

      - name: Vérification syntaxique JavaScript
        run: for file in assets/js/*.js; do node --check "$file"; done

      - name: Suite de tests (unitaires, MySQL, HTTP)
        run: php tests/run.php

  deploy:
    name: Déploiement (OVH)
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoi des fichiers
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          # Lu par lftp via --env-password : le mot de passe n'apparaît jamais
          # dans la ligne de commande
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'sftp' }}
          DEPLOY_DIR: ${{ vars.FTP_SERVER_DIR || 'www/' }}
        run: |
          case "$DEPLOY_PROTOCOL" in
            sftp|ftp) ;;
            *) echo "FTP_PROTOCOL doit valoir « sftp » ou « ftp »." >&2; exit 1 ;;
          esac

          # Fichiers de développement jamais envoyés en production
          lftp --env-password -u "$DEPLOY_USER" "$DEPLOY_PROTOCOL://$DEPLOY_HOST" <<EOF
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set sftp:auto-confirm yes
          set ftp:ssl-allow no
          mirror --reverse --no-perms --parallel=4 --verbose=1 \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .claude/ \
            --exclude-glob .gitignore --exclude-glob .gitattributes \
            --exclude-glob tests/ --exclude-glob dev/ --exclude-glob docs/ \
            --exclude-glob database/ --exclude-glob storage/ \
            --exclude-glob README.md --exclude-glob composer.json --exclude-glob composer.lock \
            ./ "$DEPLOY_DIR"
          bye
          EOF
